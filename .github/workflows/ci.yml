name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'misc.txt'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'misc.txt'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting on test suite
        shell: bash
        run: |
          mapfile -t files < <(find tests -type f \( -name '*.cpp' -o -name '*.h' \) -print | sort)
          if ((${#files[@]} > 0)); then
            clang-format --dry-run --Werror "${files[@]}"
          fi

  build-test:
    name: GCC / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    env:
      CC: gcc
      CXX: g++
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-gcc-${{ matrix.build_type }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-gcc-${{ matrix.build_type }}-
            ccache-${{ runner.os }}-gcc-
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Configure
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DBUILD_TESTING=ON
          -DBUILD_GUI=ON
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
      - name: Show ccache statistics
        run: ccache --show-stats
