name: Sanitizers

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'misc.txt'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'misc.txt'

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan-ubsan:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-gcc-asan-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-gcc-asan-
            ccache-${{ runner.os }}-gcc-
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Configure
        run: >-
          cmake --preset asan
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset asan --parallel 2
      - name: Test
        run: ctest --preset asan --output-on-failure
      - name: Show ccache statistics
        run: ccache --show-stats
